name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: nebula-blocks-app

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set unique version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'PYEOF'
          import re, os
          # Play Console rejects re-uploading a build with a versionCode
          # that's already been used. Capacitor defaults to versionCode 1
          # every time, so we stamp each build with GitHub's own run number
          # instead — it always increases, so this fix is permanent.
          path = "android/app/build.gradle"
          content = open(path).read()
          run_number = os.environ["RUN_NUMBER"]
          content = re.sub(r"versionCode\s+\d+", f"versionCode {run_number}", content)
          content = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.{run_number}"', content)
          open(path, "w").write(content)
          print(f"versionCode set to {run_number}, versionName set to 1.0.{run_number}")
          PYEOF

      - name: Bump target/compile SDK version
        run: |
          python3 - << 'PYEOF'
          import re
          # Google Play now requires targeting at least API 35. Capacitor's
          # default generated project may target an older API, so we bump
          # it here every build regardless of what Capacitor's default is.
          path = "android/variables.gradle"
          content = open(path).read()
          content = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 35", content)
          content = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 35", content)
          open(path, "w").write(content)
          print("Target/compile SDK bumped to 35.")
          PYEOF

      - name: Generate app icons from source
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Configure AdMob App ID
        run: |
          python3 - << 'PYEOF'
          # Block Nova's real AdMob App ID. (Ad unit IDs used inside the app
          # are still flagged as test-mode in the game code until we're
          # ready for public release — see index.html for that toggle.)
          ADMOB_APP_ID = "ca-app-pub-8574992910047770~4705882361"

          strings_path = "android/app/src/main/res/values/strings.xml"
          s = open(strings_path).read()
          if "admob_app_id" not in s:
              s = s.replace("</resources>", f'    <string name="admob_app_id">{ADMOB_APP_ID}</string>\n</resources>')
              open(strings_path, "w").write(s)

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          m = open(manifest_path).read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in m:
              meta = '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/>\n    '
              m = m.replace("<activity", meta + "<activity", 1)
              open(manifest_path, "w").write(m)
          print("AdMob config injected.")
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: nebula-blocks-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-blocks-debug-apk
          path: nebula-blocks-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          python3 - << 'PYEOF'
          path = "android/app/build.gradle"
          g = open(path).read()
          signing_block = (
              "\n"
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file(\"release.keystore\")\n"
              "            storePassword System.getenv(\"SIGNING_PASSWORD\")\n"
              "            keyAlias \"blocknova\"\n"
              "            keyPassword System.getenv(\"SIGNING_PASSWORD\")\n"
              "        }\n"
              "    }\n"
              "    buildTypes {\n"
              "        release {\n"
              "            signingConfig signingConfigs.release\n"
              "        }\n"
              "    }\n"
          )
          idx = g.find("android {")
          insert_at = idx + len("android {")
          g = g[:insert_at] + signing_block + g[insert_at:]
          open(path, "w").write(g)
          print("Signing config injected.")
          PYEOF

      - name: Build signed release AAB
        if: ${{ env.HAS_SIGNING == 'true' }}
        working-directory: nebula-blocks-app/android
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nebula-blocks-release-aab
          path: nebula-blocks-app/android/app/build/outputs/bundle/release/app-release.aab
