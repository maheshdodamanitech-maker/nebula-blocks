name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: nebula-blocks-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons from source
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Configure AdMob App ID
        run: |
          python3 - << 'PYEOF'
          # NOTE: This uses Google's official TEST App ID so builds are safe
          # during development. Swap ADMOB_APP_ID below for your real AdMob
          # App ID once your account is approved and ready for production.
          ADMOB_APP_ID = "ca-app-pub-3940256099942544~3347511713"

          strings_path = "android/app/src/main/res/values/strings.xml"
          s = open(strings_path).read()
          if "admob_app_id" not in s:
              s = s.replace("</resources>", f'    <string name="admob_app_id">{ADMOB_APP_ID}</string>\n</resources>')
              open(strings_path, "w").write(s)

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          m = open(manifest_path).read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in m:
              meta = '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/>\n    '
              m = m.replace("<activity", meta + "<activity", 1)
              open(manifest_path, "w").write(m)
          print("AdMob config injected.")
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: nebula-blocks-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-blocks-debug-apk
          path: nebula-blocks-app/android/app/build/outputs/apk/debug/app-debug.apk
